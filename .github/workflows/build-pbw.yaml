name: Build Pebble app

on:
  push:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'vitest.config.js'
      - 'wscript'
      - '.github/workflows/build-pbw.yaml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: js tests
        run: npm install --package-lock=false && npm test
      - name: watch C regression tests
        run: make -C tests/c
      - name: verify Telegram bundle
        working-directory: scripts
        run: |
          npm ci
          npm run verify:telegram
          npm run smoke:telegram
      - name: install pebble tool
        run: pip install pebble-tool==5.0.40
      - name: install sdk
        run: pebble sdk install 4.33.1 </dev/null
      - name: pebble-build
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          npm_config_package_lock: 'false'
        run: |
          if [ -z "$TELEGRAM_APP_ID" ] && [ -z "$TELEGRAM_APP_HASH" ]; then
            echo "Building without Telegram sign-in; set both repository secrets for a configured app."
            export SQUIRE_ALLOW_UNCONFIGURED_TELEGRAM=1
          fi
          pebble build -- -j4
      - name: rename-app
        run: cp build/*.pbw Squire-g${{ env.COMMIT_SHORT_SHA }}.pbw
      - name: generate elf bundle
        run: |
          mkdir elfs
          for elf in build/*/pebble-app.elf; do
            platform=$(basename "$(dirname "$elf")")
            cp "$elf" "elfs/pebble-app-${platform}.elf"
          done
          zip -r elfs.zip elfs
      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: Squire PBW
          path: Squire-g${{ env.COMMIT_SHORT_SHA }}.pbw
          if-no-files-found: error
      - name: Upload ELFs
        uses: actions/upload-artifact@v4
        with:
          name: Debug ELFs
          path: elfs.zip
